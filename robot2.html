<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Hero - Three.js</title>
    <!-- Tailwind CSS para sa UI Layout -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <section id="hero-section" class="relative w-full h-screen min-h-[600px] overflow-hidden transition-colors duration-500" style="background: linear-gradient(to bottom, #cecbcb 0%, #cecbcb 55%, #9a9a9a 65%, #bebebe 100%);">
        
        <!-- Background Text -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none overflow-hidden" style="z-index: 0;">
            <h1 id="bg-text" class="font-sans font-black select-none whitespace-nowrap text-black/[0.13] transition-colors duration-500" style="letter-spacing: -0.05em; font-size: clamp(4rem, 15vw, 14rem); line-height: 1; transform: translate(0px, 40px);">
                MY PORTFOLIO!
            </h1>
        </div>

        <!-- Three.js Canvas Container -->
        <div id="canvas-container" class="absolute inset-0 z-10"></div>

        <!-- Navbar Overlay -->
        <nav class="sticky top-0 z-50 w-full pt-8 px-8 pointer-events-none">
            <div class="w-full max-w-[1400px] mx-auto flex flex-col relative pointer-events-auto">
                <div class="flex flex-col lg:flex-row items-center justify-between relative gap-4 lg:gap-0">
                    <div class="flex flex-wrap justify-center lg:justify-start items-center gap-2 sm:gap-3 z-25">
                        <a href="#" class="nav-btn relative px-7 py-2.5 rounded-full bg-white text-black hover:bg-zinc-200 text-sm font-bold transition-all shadow-[0_4px_14px_rgba(255,255,255,0.15)]">Product</a>
                        <a href="#" class="nav-btn relative px-7 py-2.5 rounded-full bg-white text-black hover:bg-zinc-200 text-sm font-bold transition-all shadow-[0_4px_14px_rgba(255,255,255,0.15)]">About</a>
                        <a href="#" class="nav-btn relative px-7 py-2.5 rounded-full bg-white text-black hover:bg-zinc-200 text-sm font-bold transition-all shadow-[0_4px_14px_rgba(255,255,255,0.15)]">Specs</a>
                        <a href="#" class="nav-btn relative px-7 py-2.5 rounded-full bg-white text-black hover:bg-zinc-200 text-sm font-bold transition-all shadow-[0_4px_14px_rgba(255,255,255,0.15)]">Reviews</a>
                    </div>

                    <div class="flex flex-wrap justify-center lg:justify-end items-center gap-2 sm:gap-3 w-full lg:w-auto mt-4 lg:mt-0 z-25">
                        <a href="#" class="nav-btn px-5 sm:px-7 py-2.5 rounded-full bg-white text-black hover:bg-zinc-200 text-xs sm:text-sm font-bold transition-all shadow-[0_4px_14px_rgba(255,255,255,0.15)]">Contact</a>
                        <button class="px-5 sm:px-7 py-2.5 rounded-full bg-[#00ffc6] text-black text-xs sm:text-sm font-black hover:bg-[#00e5b2] transition-colors flex items-center gap-2 shadow-[0_0_20px_rgba(0,255,198,0.4)]">
                            Buy Now
                        </button>
                        <!-- Dark Mode Toggle Button -->
                        <button id="theme-toggle" class="px-5 sm:px-7 py-2.5 rounded-full bg-black text-white hover:bg-zinc-800 text-xs sm:text-sm font-bold transition-all shadow-[0_4px_14px_rgba(0,0,0,0.2)] flex items-center gap-2">
                            🌙 Dark Mode
                        </button>
                    </div>
                </div>
                <div id="nav-line" class="w-full mt-6 border-b-2 border-dotted border-white/30 transition-colors duration-500"></div>
            </div>
        </nav>
    </section>

    <script>
        // Dark Mode Toggle Logic
        const themeToggleBtn = document.getElementById('theme-toggle');
        const heroSection = document.getElementById('hero-section');
        const bgText = document.getElementById('bg-text');
        const navLine = document.getElementById('nav-line');
        const navButtons = document.querySelectorAll('.nav-btn');

        let isDarkMode = false;

        themeToggleBtn.addEventListener('click', () => {
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                heroSection.style.background = "linear-gradient(to bottom, #111111 0%, #111111 55%, #050505 65%, #000000 100%)";
                bgText.className = "font-sans font-black select-none whitespace-nowrap text-white/[0.05] transition-colors duration-500";
                navLine.style.borderColor = "rgba(255, 255, 255, 0.1)";
                navButtons.forEach(btn => {
                    btn.style.backgroundColor = "#27272a";
                    btn.style.color = "#ffffff";
                });
                themeToggleBtn.innerHTML = "☀️ Light Mode";
                themeToggleBtn.style.backgroundColor = "#ffffff";
                themeToggleBtn.style.color = "#000000";
            } else {
                heroSection.style.background = "linear-gradient(to bottom, #cecbcb 0%, #cecbcb 55%, #9a9a9a 65%, #bebebe 100%)";
                bgText.className = "font-sans font-black select-none whitespace-nowrap text-black/[0.13] transition-colors duration-500";
                navLine.style.borderColor = "rgba(255, 255, 255, 0.3)";
                navButtons.forEach(btn => {
                    btn.style.backgroundColor = "#ffffff";
                    btn.style.color = "#000000";
                });
                themeToggleBtn.innerHTML = "🌙 Dark Mode";
                themeToggleBtn.style.backgroundColor = "#000000";
                themeToggleBtn.style.color = "#ffffff";
            }
        });

        // Scene, Camera, Renderer Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0.2, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);

        // Mouse Tracking Variables
        const mouse = { x: 0, y: 0, normalizedX: 0, normalizedY: 0 };
        window.addEventListener('mousemove', (event) => {
            mouse.normalizedX = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.normalizedY = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        // PBR Textures Generation (Noise/Bump)
        function generatePbrTextures() {
            const size = 512;
            const canvasC = document.createElement('canvas');
            const canvasB = document.createElement('canvas');
            canvasC.width = canvasB.width = size;
            canvasC.height = canvasB.height = size;
            const ctxC = canvasC.getContext('2d');
            const ctxB = canvasB.getContext('2d');

            ctxC.fillStyle = "#dcdcdc";
            ctxC.fillRect(0, 0, size, size);
            ctxB.fillStyle = "#808080";
            ctxB.fillRect(0, 0, size, size);

            for (let i = 0; i < 10000; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const r = 0.5 + Math.random() * 1.5;
                const isDark = Math.random() > 0.15;

                ctxC.beginPath();
                ctxC.arc(x, y, r, 0, Math.PI * 2);
                ctxC.fillStyle = isDark ? "#222222" : "#dddddd";
                ctxC.fill();

                ctxB.beginPath();
                ctxB.arc(x, y, r, 0, Math.PI * 2);
                ctxB.fillStyle = isDark ? "#000000" : "#ffffff";
                ctxB.fill();
            }

            const texC = new THREE.CanvasTexture(canvasC);
            const texB = new THREE.CanvasTexture(canvasB);
            texC.wrapS = texB.wrapS = THREE.RepeatWrapping;
            texC.wrapT = texB.wrapT = THREE.RepeatWrapping;
            texC.repeat.set(6, 3);
            texB.repeat.set(6, 3);

            return { colorMap: texC, bumpMap: texB };
        }

        const textures = generatePbrTextures();
        const chasisMaterial = new THREE.MeshStandardMaterial({
            color: "#c4c4c4",
            map: textures.colorMap,
            bumpMap: textures.bumpMap,
            bumpScale: 0.005,
            roughness: 1.0,
            metalness: 0.0
        });

        // Robot Main Group
        const robotGroup = new THREE.Group();
        robotGroup.position.set(0, -0.3, 0);
        scene.add(robotGroup);

        // 1. Robot Body (Sphere Base)
        const bodyGeometry = new THREE.SphereGeometry(0.43, 64, 64, 0, Math.PI * 2, Math.PI * 0.15, Math.PI * 0.85);
        const bodyMesh = new THREE.Mesh(bodyGeometry, chasisMaterial);
        bodyMesh.castShadow = true;
        bodyMesh.receiveShadow = true;
        robotGroup.add(bodyMesh);

        // Body Bevel Ring
        const bevelGeo = new THREE.TorusGeometry(0.235, 0.025, 32, 64);
        const bevelMesh = new THREE.Mesh(bevelGeo, chasisMaterial);
        bevelMesh.position.set(0, 0.34, 0);
        bevelMesh.rotation.x = Math.PI / 2;
        robotGroup.add(bevelMesh);

        // 2. Neck
        const neckPoints = [
            -0.05, 0.215,
            0.02, 0.28,
            0.045, 0.295,
            0.055, 0.27,
            0.055, 0.1,
            -0.05, 0.1
        ].reduce((acc, val, i, arr) => {
            if (i % 2 === 0) acc.push(new THREE.Vector2(arr[i+1], arr[i]));
            return acc;
        }, []);

        const neckGeo = new THREE.LatheGeometry(neckPoints, 64);
        const neckMesh = new THREE.Mesh(neckGeo, chasisMaterial);
        robotGroup.add(neckMesh);

        // 3. Robot Head Group
        const headGroup = new THREE.Group();
        headGroup.position.set(0, 0.6, 0);
        robotGroup.add(headGroup);

        const headMat = new THREE.MeshStandardMaterial({ color: "#111111", roughness: 1.0 });
        const headMesh = new THREE.Mesh(new THREE.SphereGeometry(0.28, 64, 64, 0, Math.PI * 2, 0, Math.PI), headMat);
        headGroup.add(headMesh);

        // Glass Screen Shader
        const glassMat = new THREE.ShaderMaterial({
            uniforms: {
                color: { value: new THREE.Color("#00ffc6") },
                power: { value: 3.8 },
                intensity: { value: 1.2 }
            },
            vertexShader: `
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    vViewPosition = -mvPosition.xyz;
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `,
            fragmentShader: `
                uniform vec3 color;
                uniform float power;
                uniform float intensity;
                varying vec3 vNormal;
                varying vec3 vViewPosition;
                void main() {
                    vec3 normal = normalize(vNormal);
                    vec3 viewDir = normalize(vViewPosition);
                    float fresnel = 1.0 - max(dot(viewDir, normal), 0.0);
                    fresnel = pow(fresnel, power);
                    gl_FragColor = vec4(color, fresnel * intensity);
                }
            `,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const glassMesh = new THREE.Mesh(new THREE.SphereGeometry(0.3, 64, 64, 0, Math.PI * 2, 0, Math.PI), glassMat);
        headGroup.add(glassMesh);

        // Pinalaking mga Mata (Mas malaki para kapareho ng reference image)
        const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const leftEye = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.075, 0.01), eyeMat);
        leftEye.position.set(-0.075, 0.0, 0.28);
        headGroup.add(leftEye);

        const rightEye = new THREE.Mesh(new THREE.BoxGeometry(0.045, 0.075, 0.01), eyeMat);
        rightEye.position.set(0.075, 0.0, 0.28);
        headGroup.add(rightEye);

        // Tenga / Antennas sa gilid
        function createEar(isLeft) {
            const earGroup = new THREE.Group();
            const dir = isLeft ? -1 : 1;
            earGroup.position.set(dir * 0.31, 0.02, 0);

            const baseMat = new THREE.MeshStandardMaterial({ color: "#e0e0e0", roughness: 0.4 });
            const base = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 0.06, 32), baseMat);
            base.rotation.z = (Math.PI / 2) * dir;
            earGroup.add(base);

            const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.12, 16), baseMat);
            stick.position.set(dir * 0.06, 0, 0);
            earGroup.add(stick);

            const tipMat = new THREE.MeshBasicMaterial({ color: 0x00ffc6 });
            const tip = new THREE.Mesh(new THREE.SphereGeometry(0.025, 16, 16), tipMat);
            tip.position.set(dir * 0.13, 0, 0);
            earGroup.add(tip);

            return earGroup;
        }

        headGroup.add(createEar(true));
        headGroup.add(createEar(false));

        // Animation Loop, Cursor Tracking, at Blinking Logic
        const clock = new THREE.Clock();
        let blinkTimer = 0;
        let isBlinking = false;
        let blinkDuration = 0;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            // Blinking Logic
            blinkTimer += delta;
            if (!isBlinking && blinkTimer > Math.random() * 3 + 2) {
                isBlinking = true;
                blinkDuration = 0;
            }

            if (isBlinking) {
                blinkDuration += delta;
                leftEye.scale.y = 0.1;
                rightEye.scale.y = 0.1;
                if (blinkDuration > 0.15) {
                    isBlinking = false;
                    blinkTimer = 0;
                }
            } else {
                leftEye.scale.y = THREE.MathUtils.lerp(leftEye.scale.y, 1, 15 * delta);
                rightEye.scale.y = THREE.MathUtils.lerp(rightEye.scale.y, 1, 15 * delta);
            }

            // Smooth Cursor Movement Mapping
            const targetPosX = mouse.normalizedX * 1.0;
            robotGroup.position.x = THREE.MathUtils.lerp(robotGroup.position.x, targetPosX, 3.5 * delta);

            const relativeX = mouse.normalizedX - robotGroup.position.x;

            // Body Tilt & Rotation
            const bodyTargetRotY = -relativeX * 0.95;
            const bodyTargetRotX = -mouse.normalizedY * 0.25;
            const bodyTargetRotZ = -relativeX * 0.15;

            robotGroup.rotation.y = THREE.MathUtils.lerp(robotGroup.rotation.y, bodyTargetRotY, 10.0 * delta);
            robotGroup.rotation.x = THREE.MathUtils.lerp(robotGroup.rotation.x, bodyTargetRotX, 10.0 * delta);
            robotGroup.rotation.z = THREE.MathUtils.lerp(robotGroup.rotation.z, bodyTargetRotZ, 10.0 * delta);

            // Head Look Rotation
            const headTargetRotY = relativeX * 1.8;
            const headTargetRotX = -mouse.normalizedY * 0.3;

            headGroup.rotation.y = THREE.MathUtils.lerp(headGroup.rotation.y, headTargetRotY, 15.0 * delta);
            headGroup.rotation.x = THREE.MathUtils.lerp(headGroup.rotation.x, headTargetRotX, 15.0 * delta);

            renderer.render(scene, camera);
        }

        animate();

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
